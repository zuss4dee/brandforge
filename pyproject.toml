[project]
name = "brandforge"
version = "0.1.0"
description = "Discover startup-quality company names founders can actually own."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Double Metaphone for holdout phonetic exclusion (M1.0 §5.2). Exact-match
    # exclusion alone lets a near-duplicate carry a held-out name through.
    "metaphone>=0.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "mypy>=1.11",
    "ruff>=0.6",
    "import-linter>=2.0",
    "pre-commit>=3.8",
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine", "services", "tools"]


# ─────────────────────────────────────────────────────────────────────────────
# Ruff — lint + format
# ─────────────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "A",           # builtin shadowing
    "C4",          # comprehensions
    "DTZ",         # naive datetimes
    "T20",         # no print()
    "SIM",         # simplify
    "PTH",         # prefer pathlib
    "RUF",         # ruff-specific
    "ANN",         # missing annotations
    "S",           # bandit
    "PL",          # pylint
    "TID",         # tidy imports
]
ignore = [
    "ANN401",      # allow typing.Any where deliberate
    "PLR0913",     # argument count — engine builders legitimately take many
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004"]   # asserts and magic numbers are the point
"tools/**" = ["T20"]                       # CLI tooling prints by design

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true


# ─────────────────────────────────────────────────────────────────────────────
# MyPy — strict everywhere, no exceptions carved out yet
# ─────────────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
show_error_codes = true
files = ["engine", "services", "tools", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# `metaphone` ships no py.typed marker. Narrowed to this one module rather than
# relaxing strictness globally; the untyped boundary is wrapped in
# services/corpus/holdout.phonetic_key, which returns a checked `str`.
module = ["metaphone.*"]
ignore_missing_imports = true


# ─────────────────────────────────────────────────────────────────────────────
# Pytest
# ─────────────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: long-running; excluded from the default pre-commit run",
]


# ─────────────────────────────────────────────────────────────────────────────
# Import Linter — ADR-0006 (pure engine boundary)
#
# These contracts are the enforcement mechanism for ADR-0006. Without them the
# "modular monolith" of ADR-0001 degrades into a big ball of mud and the
# service-extraction path closes silently.
# ─────────────────────────────────────────────────────────────────────────────
[tool.importlinter]
root_packages = ["engine", "services", "tools"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "engine must not depend on services, apps, or tools"
type = "forbidden"
source_modules = ["engine"]
forbidden_modules = ["services", "apps", "tools"]

[[tool.importlinter.contracts]]
# ADR-0006: no I/O, no clock, no ambient randomness. Forbidding `random`,
# `time` and `datetime` is what makes determinism (ADR-0012) structural rather
# than a convention — a seed must be passed in explicitly or not exist at all.
name = "engine must be pure: no I/O, no clock, no ambient randomness"
type = "forbidden"
source_modules = ["engine"]
forbidden_modules = [
    # network
    "socket", "urllib", "http", "ftplib", "telnetlib",
    "requests", "httpx", "aiohttp", "urllib3",
    # process / filesystem
    "subprocess", "shutil", "tempfile", "pathlib", "os", "io", "glob",
    # concurrency (engine is synchronous and pure)
    "asyncio", "threading", "multiprocessing",
    # persistence
    "sqlalchemy", "psycopg", "asyncpg", "redis", "boto3", "sqlite3",
    # model providers
    "anthropic", "openai",
    # nondeterminism
    "random", "secrets", "time", "datetime", "uuid",
]

[[tool.importlinter.contracts]]
name = "services must not depend on apps"
type = "forbidden"
source_modules = ["services"]
forbidden_modules = ["apps"]


# ─────────────────────────────────────────────────────────────────────────────
# BrandForge tooling
# ─────────────────────────────────────────────────────────────────────────────
[tool.brandforge.corpus]
# Scanned by tools/check_corpus.py. Empty until a corpus is built — the guards
# ship before the data they guard, as with the inventory lock.
artifacts = "data/corpus/artifacts"
holdout = "evals/holdout"

[tool.brandforge.inventory]
# Directory scanned by tools/inventory_lock.py for append-only violations.
# Empty until M1.5 — the guard ships before the data it guards (ADR-0014).
root = "engine/rulesets"
